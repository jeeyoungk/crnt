name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # cancel superseded PR runs; never cancel a run on main, which may be releasing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    name: Code Quality & Tests (node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # 22 is the minimum version supported by our library (package.json engines).
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Check code formatting
        if: always() && steps.install.conclusion == 'success'
        run: pnpm format
      - name: Run linting
        if: always() && steps.install.conclusion == 'success'
        run: pnpm lint
      - name: Run type checking
        if: always() && steps.install.conclusion == 'success'
        run: pnpm typecheck
      - name: Build package
        if: always() && steps.install.conclusion == 'success'
        run: pnpm build
      - name: Check package exports
        if: always() && steps.install.conclusion == 'success'
        run: pnpm check:attw
      - name: Test (⚡️ node via vitest)
        if: always() && steps.install.conclusion == 'success'
        run: pnpm test
      - name: Test (🌎 browser via playwright)
        if: always() && steps.install.conclusion == 'success'
        run: pnpm test:browser
      - name: Run Documentation
        if: always() && steps.install.conclusion == 'success'
        run: pnpm run docs --treatWarningsAsErrors

  release:
    runs-on: ubuntu-latest
    needs: quality-checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
      pages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package
        run: pnpm build
      - name: Release and Publish
        id: semantic_release
        run: |
          # Store git HEAD before semantic-release
          BEFORE_SHA=$(git rev-parse HEAD)
          echo "before_sha=$BEFORE_SHA" >> $GITHUB_OUTPUT

          # Run semantic-release
          pnpm semantic-release

          # Check if semantic-release created a new commit (indicating a release)
          AFTER_SHA=$(git rev-parse HEAD)
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "new_release=true" >> $GITHUB_OUTPUT
            echo "latest_tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
          else
            echo "new_release=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # This one needs to be after release, as release changes the version number.
      - name: Generate documentation
        if: always() && steps.semantic_release.outputs.new_release == 'true'
        run: pnpm run docs
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: always() && steps.semantic_release.outputs.new_release == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          cname: 'crnt.jeeyoungk.com'
