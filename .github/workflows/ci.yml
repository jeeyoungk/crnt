name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    name: Code Quality & Tests

    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # minimum version supported by our library.
          cache: pnpm
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Check code formatting
        if: always() && steps.install.conclusion == 'success'
        run: pnpm format
      - name: Run linting
        if: always() && steps.install.conclusion == 'success'
        run: pnpm lint
      - name: Run type checking
        if: always() && steps.install.conclusion == 'success'
        run: pnpm typecheck
      - name: Build package
        if: always() && steps.install.conclusion == 'success'
        run: pnpm tsup
      - name: Check package exports
        if: always() && steps.install.conclusion == 'success'
        run: pnpm check:attw
      - name: Test (⚡️ node via vitest)
        if: always() && steps.install.conclusion == 'success'
        run: pnpm test
      - name: Test (🌎 browser via playwright)
        if: always() && steps.install.conclusion == 'success'
        run: pnpm test:browser
      - name: Run Documentation
        if: always() && steps.install.conclusion == 'success'
        run: pnpm run docs --treatWarningsAsErrors

  release:
    runs-on: ubuntu-latest
    needs: quality-checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
      pages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package
        run: pnpm tsup
      - name: Release and Publish
        id: semantic_release
        run: |
          # Store git HEAD before semantic-release
          BEFORE_SHA=$(git rev-parse HEAD)
          echo "before_sha=$BEFORE_SHA" >> $GITHUB_OUTPUT

          # Run semantic-release
          pnpm semantic-release

          # Check if semantic-release created a new commit (indicating a release)
          AFTER_SHA=$(git rev-parse HEAD)
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "new_release=true" >> $GITHUB_OUTPUT
            echo "latest_tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
          else
            echo "new_release=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # This one needs to be after release, as release changes the version number.
      - name: Generate documentation
        if: always() && steps.semantic_release.outputs.new_release == 'true'
        run: pnpm run docs
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always() && steps.semantic_release.outputs.new_release == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          cname: 'crnt.jeeyoungk.com'
